<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maven Toys Analytics Hub — mockup</title>
<style>
:root{
  --bg:#f6f6f4; --surface:#fcfcfb; --line:#e4e3de; --grid:#ecebe6;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#85847e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --seq:#2a78d6; --good:#0e7a4f; --bad:#b4332f;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:24px;height:60px}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--s1),var(--s5));display:grid;place-items:center;color:#fff;font-size:14px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav button:hover{background:#efeeea}
nav button.on{background:#e9f1fc;color:#1c5cab;font-weight:600}
.badge{font-size:12px;color:var(--ink2);background:#efeeea;border-radius:999px;padding:4px 10px;white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px} .sub{color:var(--ink2);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.card h3{margin:0 0 2px;font-size:14px} .card .note{color:var(--ink3);font-size:12px;margin-bottom:10px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;color:var(--ink2)}
.chip:hover{border-color:#c9c8c1}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
input[type=search],input[type=text],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font:inherit;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font:inherit;color:var(--ink2);cursor:pointer}
.seg button.on{background:#e9f1fc;color:#1c5cab;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi .l{color:var(--ink2);font-size:12px} .kpi .v{font-size:24px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
svg text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;fill:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--ink2);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--grid)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#c9c8c1}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.defs{font-size:12px;color:var(--ink2);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
#tip{position:fixed;pointer-events:none;background:#161615;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;opacity:0;transition:opacity .08s;z-index:50;white-space:nowrap}
.tab{display:none}.tab.on{display:block}
/* presentation */
.deck{background:linear-gradient(160deg,#10223d,#1b1f3a);color:#fff;border-radius:18px;min-height:460px;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.deck h2{font-size:34px;line-height:1.15;margin:0 0 14px;letter-spacing:-.02em;max-width:760px}
.deck p{color:#c9d6ee;max-width:720px;font-size:16px}
.deck .big{font-size:72px;font-weight:800;letter-spacing:-.04em}
.deck svg text{fill:#c9d6ee!important}
.deck .ctl{display:flex;justify-content:space-between;align-items:center;color:#9fb2d6;font-size:13px}
.deck .ctl button{background:#ffffff1a;color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}
.deck .ctl button:hover{background:#ffffff33}
.src{font-size:12px;color:#9fb2d6;margin-top:12px}
/* toy finder */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.toy{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .1s,box-shadow .1s}
.toy:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0001}
.toy .img{height:120px;display:grid;place-items:center;font-size:54px}
.toy .b{padding:10px 12px 12px}
.toy .n{font-weight:600}.toy .c{font-size:12px;color:var(--ink2)}
.toy .m{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink2)}
.toy .m b{color:var(--ink)}
.drawer{position:fixed;inset:0;background:#0006;display:none;z-index:40;justify-content:flex-end}
.drawer.on{display:flex}
.panel{width:min(560px,100%);background:var(--surface);height:100%;overflow:auto;padding:22px}
.panel .hero{height:150px;border-radius:12px;display:grid;place-items:center;font-size:80px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .l{font-size:11px;color:var(--ink2)}.stat .v{font-size:18px;font-weight:700}
.tag{font-size:11px;color:var(--ink2);background:#efeeea;border-radius:6px;padding:2px 7px}
/* ask */
.chat{display:flex;flex-direction:column;gap:12px;min-height:380px}
.msg{max-width:720px;border-radius:14px;padding:12px 14px}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);width:min(720px,100%)}
.msg .meta{font-size:12px;color:var(--ink2);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.msg .meta b{color:var(--ink)}
.ok{color:var(--good);font-weight:600}
.askrow{display:flex;gap:8px;margin-top:14px}.askrow input{flex:1}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.deck{padding:28px}.deck h2{font-size:26px}.bar{gap:10px}.badge{display:none}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><span class="logo">🧸</span>Maven Toys Analytics Hub</div>
  <nav id="nav"></nav>
  <span class="badge">Data through Sep 30, 2023</span>
</div></header>
<main>
  <div id="dashboard" class="tab"></div>
  <div id="presentation" class="tab"></div>
  <div id="toys" class="tab"></div>
  <div id="ask" class="tab"></div>
</main>
<div id="tip"></div>
<div class="drawer" id="drawer"><div class="panel" id="panel"></div></div>

/* ---------- shared "metrics" layer (same definitions everywhere) ---------- */
function agg({cats=null,q="",m0=0,m1=20}={}){
  const ok = pid => (!cats||cats.includes(P[pid].cat)) && (!q||P[pid].name.toLowerCase().includes(q.toLowerCase()));
  const byMonth=Array.from({length:21},()=>({rev:0,gp:0,units:0}));
  const byProd={}, byStore={}, byCat={};
  for(const [mi,pid,u] of DATA.MP){ if(!ok(pid)||mi<m0||mi>m1) continue;
    const r=rev(pid,u),g=gp(pid,u);
    byMonth[mi].rev+=r;byMonth[mi].gp+=g;byMonth[mi].units+=u;
    const b=byProd[pid]??={rev:0,gp:0,units:0};b.rev+=r;b.gp+=g;b.units+=u;
    const c=byCat[P[pid].cat]??={rev:0,gp:0,units:0};c.rev+=r;c.gp+=g;c.units+=u;}
  // stores use the full period (store x product totals are not month-split in this mockup)
  for(const [sid,pid,u] of DATA.SP){ if(!ok(pid)) continue;
    const b=byStore[sid]??={rev:0,gp:0,units:0};b.rev+=rev(pid,u);b.gp+=gp(pid,u);b.units+=u;}
  const tot={rev:0,gp:0,units:0};for(const b of Object.values(byProd)){tot.rev+=b.rev;tot.gp+=b.gp;tot.units+=b.units}
  return {tot,byMonth,byProd,byStore,byCat};
}

/* ---------- chart helpers (plain SVG) ---------- */
function hbars(rows,{w=520,color="var(--s1)",fmt=fmt$,label=r=>r.label,rowH=26}={}){
  const max=Math.max(...rows.map(r=>r.v),1),lw=150,h=rows.length*rowH+6;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">`+rows.map((r,i)=>{
    const y=i*rowH+3,bw=Math.max(2,(w-lw-70)*r.v/max);
    return `<g data-tip="${r.tip??label(r)+": "+fmt(r.v)}"><text x="${lw-8}" y="${y+14}" text-anchor="end">${label(r).length>22?label(r).slice(0,21)+"…":label(r)}</text>
    <rect x="${lw}" y="${y+3}" width="${bw}" height="${rowH-10}" rx="3" fill="${r.color??color}"/>
    <text x="${lw+bw+6}" y="${y+14}" style="fill:var(--ink)">${fmt(r.v)}</text></g>`}).join("")+`</svg>`;
}
function line(vals,{w=640,h=240,color="var(--s1)",fmt=fmt$,labels=mlabel}={}){
  const L=44,R=12,T=10,B=26,max=Math.max(...vals)*1.1,x=i=>L+(w-L-R)*i/(vals.length-1),y=v=>T+(h-T-B)*(1-v/max);
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  const path=vals.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area=path+`L${x(vals.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const step=Math.ceil(vals.length/7);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">`+
   ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("")+
   `<path d="${area}" fill="${color}" opacity=".08"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`+
   vals.map((v,i)=>`<g data-tip="<b>${labels(i)}</b><br>${fmt(v)}"><rect x="${x(i)-((w-L-R)/(vals.length-1))/2}" y="${T}" width="${(w-L-R)/(vals.length-1)}" height="${h-T-B}" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${color}" stroke="var(--surface)" stroke-width="2"/></g>`).join("")+
   vals.map((v,i)=>i%step==0?`<text x="${x(i)}" y="${h-8}" text-anchor="middle">${labels(i)}</text>`:"").join("")+`</svg>`;
}

  <div class="grid3">
    <div class="card"><h3>Top 10 products by ${MET[m].n.toLowerCase()}</h3><div class="note">Bar color = category</div>${hbars(top,{fmt:MET[m].f})}</div>
    <div class="card"><h3>Top 8 stores by ${MET[m].n.toLowerCase()}</h3><div class="note">Full period</div>${hbars(stores,{fmt:MET[m].f})}</div>
  </div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3>All products</h3><div class="note">Click a column to sort</div></div>
    <button class="btn" onclick="csvDownload('products_filtered.csv',[['Product','Category','Units','Revenue','Est gross profit','Margin'],...dashRows.map(r=>[r.name,r.cat,r.units,r.rev.toFixed(2),r.gp.toFixed(2),(r.mg*100).toFixed(1)+'%'])])">⬇ Export CSV</button></div>
    <div style="max-height:320px;overflow:auto"><table class="tbl"><tr>${th("name","Product")}${th("cat","Category")}${th("units","Units",1)}${th("rev","Revenue",1)}${th("gp","Est. profit",1)}${th("mg","Margin",1)}</tr>
    ${rows.map(r=>`<tr><td>${EMOJI[r.pid]} ${r.name}</td><td>${r.cat}</td><td class="r">${fmtN(r.units)}</td><td class="r">${fmt$f(r.rev)}</td><td class="r">${fmt$f(r.gp)}</td><td class="r">${pct(r.mg)}</td></tr>`).join("")}</table></div></div>
  <div class="defs"><b>Definitions.</b> Revenue = units × product price. Estimated gross profit = units × (price − cost). These are <i>reconstructed</i> from one current price per product; the data has no price history, so they are not accounting figures. Source: sales.csv, products.csv, stores.csv.</div>`;
  window.dashRows=rows;
}
function toggleCat(c){ if(dash.cats.size==5){dash.cats=new Set([c])} else if(dash.cats.has(c)){dash.cats.delete(c);if(!dash.cats.size)dash.cats=new Set(CATS)} else dash.cats.add(c); renderDash()}

/* ================= TAB 2: PRESENTATION ================= */
const catStats=CATS.map(c=>({c,...ALL.byCat[c],mg:ALL.byCat[c].gp/ALL.byCat[c].rev})).sort((a,b)=>b.rev-a.rev);
const byMg=[...catStats].sort((a,b)=>b.mg-a.mg), topProf=Object.entries(ALL.byProd).sort((a,b)=>b[1].gp-a[1].gp).slice(0,5);
const peak=ALL.byMonth.map((b,i)=>[i,b.rev]).sort((a,b)=>b[1]-a[1])[0];
const share=(c)=>catStats.find(x=>x.c==c).rev/ALL.tot.rev;
const SLIDES=[
 ()=>`<div><div class="badge" style="background:#ffffff1a;color:#c9d6ee;display:inline-block">Maven Toys · Jan 2022 – Sep 2023</div><h2 style="margin-top:18px">What 21 months of toy sales across 50 stores tell us</h2><p>A five-slide readout. Every number on every slide is computed from the data when you open this page, not typed in.</p></div>`,
 ()=>`<div><p>Scale</p><div class="big">${fmt$(ALL.tot.rev)}</div><h2>in estimated revenue at a ${pct(ALL.tot.gp/ALL.tot.rev)} gross margin</h2><p>${fmtN(ALL.tot.units)} units sold. Estimated gross profit: ${fmt$(ALL.tot.gp)}.</p></div>`,
 ()=>`<div><h2>${byMg[0].c} earns the best margin (${pct(byMg[0].mg)}); ${catStats[0].c} earns the most revenue but only ${pct(catStats[0].mg)}</h2>${hbars(byMg.map(x=>({label:x.c,v:x.mg*100,color:"#86b6ef",tip:`${x.c}<br>Margin ${pct(x.mg)}<br>Revenue ${fmt$(x.rev)}`})),{fmt:v=>v.toFixed(1)+"%",w:640})}<p>${catStats[0].c} is ${pct(share(catStats[0].c))} of revenue. Revenue and profit rank the categories differently.</p></div>`,
 ()=>`<div><h2>Five products produce ${pct(topProf.reduce((s,[,b])=>s+b.gp,0)/ALL.tot.gp)} of estimated profit</h2>${hbars(topProf.map(([pid,b])=>({label:P[pid].name,v:b.gp,color:"#86b6ef"})),{fmt:fmt$,w:640})}</div>`,
 ()=>`<div><h2>Sales peak in ${mlabel(peak[0])} at ${fmt$(peak[1])}</h2>${line(ALL.byMonth.map(b=>b.rev),{w:700,h:210,color:"#86b6ef"})}</div>`,
 ()=>`<div><h2>What this does and doesn't tell us</h2><p>• Revenue and profit are reconstructed from one current price and cost per product; the data has no price history.<br>• Inventory is a single undated snapshot, so stock can't be compared over time.<br>• There is no customer data, so questions about customers can't be answered from this dataset.</p></div>`
];
let slide=0;
function renderDeck(){
  document.getElementById("presentation").innerHTML=`<h1>Presentation</h1><p class="sub">Use ← → keys or the buttons.</p>
  <div class="deck">${SLIDES[slide]()}<div class="ctl"><button onclick="go(-1)">← Back</button><span>${slide+1} / ${SLIDES.length}</span><button onclick="go(1)">Next →</button></div></div>
  <div class="src">Source: sales.csv, products.csv · Revenue = units × price · All slide numbers are computed from the data.</div>`;
}
function go(d){slide=Math.min(SLIDES.length-1,Math.max(0,slide+d));renderDeck()}
document.addEventListener("keydown",e=>{if(current=="presentation"&&!(e.target instanceof HTMLInputElement)){if(e.key=="ArrowRight")go(1);if(e.key=="ArrowLeft")go(-1)}});

/* ================= TAB 3: TOY FINDER ================= */
const toys={q:"",cat:"All",sort:"gp"};
function renderToys(){
  const list=DATA.P.filter(p=>(toys.cat=="All"||p.cat==toys.cat)&&p.name.toLowerCase().includes(toys.q.toLowerCase()))
    .map(p=>({p,...ALL.byProd[p.id]})).sort((a,b)=>toys.sort=="name"?a.p.name.localeCompare(b.p.name):b[toys.sort]-a[toys.sort]);
  document.getElementById("toys").innerHTML=`<h1>Toy Finder</h1><p class="sub">Browse the catalog and click any toy to see how it performs. <span class="tag">Mockup uses emoji placeholders; the real build uses original illustrations</span></p>
  <div class="filters"><input type="search" placeholder="Search toys…" value="${toys.q}" oninput="toys.q=this.value;renderToys();const i=document.querySelector('#toys input');i.focus();i.setSelectionRange(99,99)">
   ${["All",...CATS].map(c=>`<button class="chip ${toys.cat==c?"on":""}" onclick="toys.cat='${c}';renderToys()">${c}</button>`).join("")}
   <select onchange="toys.sort=this.value;renderToys()"><option value="gp" ${toys.sort=="gp"?"selected":""}>Sort: profit</option><option value="rev" ${toys.sort=="rev"?"selected":""}>Sort: revenue</option><option value="units" ${toys.sort=="units"?"selected":""}>Sort: units sold</option><option value="name" ${toys.sort=="name"?"selected":""}>Sort: name</option></select></div>
  ${list.length?`<div class="cards">${list.map(({p,rev,gp,units})=>`<div class="toy" onclick="openToy(${p.id})"><div class="img" style="background:${CTINT[p.cat]}">${EMOJI[p.id]}</div>
   <div class="b"><div class="n">${p.name}</div><div class="c">${p.cat} · $${p.price.toFixed(2)}</div>
   <div class="m"><span>Units <b>${fmtN(units)}</b></span><span>Profit <b>${fmt$(gp)}</b></span></div></div></div>`).join("")}</div>`:`<div class="card">No toys match “${toys.q}”. Try a different search or category.</div>`}`;
}
function openToy(id){
  const p=P[id],b=ALL.byProd[id],iv=INV[id],ms=Array.from({length:21},(_,i)=>0);
  for(const [mi,pid,u] of DATA.MP) if(pid==id) ms[mi]+=u*p.price;
  const stores=DATA.SP.filter(r=>r[1]==id).map(r=>({label:ST[r[0]].city+" #"+ST[r[0]].name.split(" ").pop(),v:rev(id,r[2])})).sort((a,b)=>b.v-a.v).slice(0,6);
  const rankP=Object.entries(ALL.byProd).sort((a,b)=>b[1].gp-a[1].gp).findIndex(([k])=>k==id)+1;
  document.getElementById("panel").innerHTML=`<div style="display:flex;justify-content:space-between"><span class="tag">${p.cat}</span><button class="btn" onclick="closeToy()">✕ Close</button></div>
  <div class="hero" style="background:${CTINT[p.cat]};margin-top:10px">${EMOJI[id]}</div><h2 style="margin:0">${p.name}</h2>
  <div class="sub" style="margin:2px 0 0">Price $${p.price.toFixed(2)} · Cost $${p.cost.toFixed(2)} · Unit margin ${pct((p.price-p.cost)/p.price)}</div>
  <div class="stats"><div class="stat"><div class="l">Units sold</div><div class="v">${fmtN(b.units)}</div></div><div class="stat"><div class="l">Revenue</div><div class="v">${fmt$(b.rev)}</div></div><div class="stat"><div class="l">Est. profit</div><div class="v">${fmt$(b.gp)}</div></div></div>
  <div class="note" style="color:var(--ink2)">Ranks #${rankP} of 35 by estimated profit.</div>
  <div class="card" style="margin:12px 0"><h3>Monthly revenue</h3>${line(ms,{w:500,h:170})}</div>
  <div class="card" style="margin:12px 0"><h3>Top stores</h3><div class="note">By revenue, full period</div>${hbars(stores,{w:500})}</div>
  <div class="card"><h3>Stock on hand (current snapshot)</h3><div class="note">One undated snapshot, not a history</div>
  ${iv?`<b style="font-size:20px">${fmtN(iv.stock)}</b> units across ${iv.stocked} of 50 stores · <b>${iv.zero}</b> store${iv.zero==1?"":"s"} at zero stock`:"No inventory rows for this product."}</div>`;
  document.getElementById("drawer").classList.add("on");
}
function closeToy(){document.getElementById("drawer").classList.remove("on")}
document.getElementById("drawer").addEventListener("click",e=>{if(e.target.id=="drawer")closeToy()});

/* ================= TAB 4: ASK ================= */
const q3=agg({m0:18,m1:20});
const table=(head,rows)=>({head,rows});
const QS=[
 {id:"profit_q3",title:"Which products generated the most profit last quarter?",kw:"profit products last quarter most generated top q3 best earn",
  run:()=>{const r=Object.entries(q3.byProd).sort((a,b)=>b[1].gp-a[1].gp).slice(0,5);return {text:`In the last full quarter in the data (Q3 2023, Jul–Sep), ${P[r[0][0]].name} generated the most estimated profit at ${fmt$f(r[0][1].gp)}.`,
    rows:r.map(([id,b])=>({label:P[id].name,v:b.gp})),fmt:fmt$f,cols:["Product","Est. profit"],src:"sales.csv · products.csv",def:"Est. gross profit = units × (price − cost); quarter = Q3 2023, the last full quarter in the data."}}},
 {id:"store_rev",title:"Which store had the highest revenue?",kw:"store highest revenue best location sales most",
  run:()=>{const r=Object.entries(ALL.byStore).sort((a,b)=>b[1].rev-a[1].rev).slice(0,5);return {text:`${ST[r[0][0]].name} had the highest revenue at ${fmt$f(r[0][1].rev)} over the full period.`,rows:r.map(([id,b])=>({label:ST[id].name,v:b.rev})),fmt:fmt$f,cols:["Store","Revenue"],src:"sales.csv · products.csv · stores.csv",def:"Revenue = units × price, full period Jan 2022 – Sep 2023."}}},
 {id:"cat_margin",title:"Which product category had the best gross margin?",kw:"category margin best gross profitability highest",
  run:()=>{const r=[...byMg];return {text:`${r[0].c} had the best gross margin at ${pct(r[0].mg)}, while ${r[r.length-1].c} had the lowest at ${pct(r[r.length-1].mg)}.`,rows:r.map(x=>({label:x.c,v:x.mg*100})),fmt:v=>v.toFixed(1)+"%",cols:["Category","Gross margin"],src:"sales.csv · products.csv",def:"Margin = estimated gross profit ÷ revenue."}}},
 {id:"units_top",title:"What were the five best-selling products?",kw:"best selling five products units sold popular top 5",
  run:()=>{const r=Object.entries(ALL.byProd).sort((a,b)=>b[1].units-a[1].units).slice(0,5);return {text:`${P[r[0][0]].name} sold the most units (${fmtN(r[0][1].units)}). “Best-selling” here means units sold, not revenue.`,rows:r.map(([id,b])=>({label:P[id].name,v:b.units})),fmt:fmtN,cols:["Product","Units sold"],src:"sales.csv · products.csv",def:"Units sold = sum of transaction units."}}},
 {id:"store_profit",title:"Which stores had the greatest estimated profit?",kw:"stores greatest estimated profit most profitable",
  run:()=>{const r=Object.entries(ALL.byStore).sort((a,b)=>b[1].gp-a[1].gp).slice(0,5);return {text:`${ST[r[0][0]].name} had the greatest estimated profit at ${fmt$f(r[0][1].gp)}.`,rows:r.map(([id,b])=>({label:ST[id].name,v:b.gp})),fmt:fmt$f,cols:["Store","Est. profit"],src:"sales.csv · products.csv · stores.csv",def:"Est. gross profit = units × (price − cost)."}}},
 {id:"low_stock",title:"Which products currently have the least inventory?",kw:"products least inventory low stock lowest running out",
  run:()=>{const r=DATA.INV.map(x=>[x[0],x[1]]).sort((a,b)=>a[1]-b[1]).slice(0,5);return {text:`${P[r[0][0]].name} has the least stock on hand across all stores (${fmtN(r[0][1])} units). This is a single snapshot, not a trend.`,rows:r.map(([id,v])=>({label:P[id].name,v})),fmt:fmtN,cols:["Product","Units in stock"],src:"inventory.csv · products.csv",def:"Stock on hand summed across stores from the supplied snapshot. Not a historical quantity."}}},
 {id:"best_month",title:"Which month had the highest revenue?",kw:"month highest revenue peak best busiest season",
  run:()=>{const r=ALL.byMonth.map((b,i)=>({label:mlabel(i),v:b.rev})).sort((a,b)=>b.v-a.v).slice(0,5);return {text:`${r[0].label} had the highest revenue at ${fmt$f(r[0].v)}.`,rows:r,fmt:fmt$f,cols:["Month","Revenue"],src:"sales.csv · products.csv",def:"Revenue = units × price."}}},
];
const AMBIG=/\b(best|favorite|favourite|greatest)\b.*\b(toy|product)\b|\bwhich toy is the best\b/i;
const UNSUP=/(customer|satisf|review|rating|return|refund|forecast|predict|next year|why)/i;
const STOP=new Set("the a an of in is are what which who how do we our to for and was were had has have with on at by me show tell".split(" "));
const toks=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w));
function match(q){const t=new Set(toks(q));let best=null,bs=0,all=[];
  for(const Q of QS){const k=new Set(toks(Q.kw+" "+Q.title));let hit=0;for(const w of t)if(k.has(w))hit++;const s=hit/Math.max(3,t.size);all.push([Q,s]);if(s>bs){bs=s;best=Q}}
  all.sort((a,b)=>b[1]-a[1]);return {best,score:bs,near:all.slice(0,3).map(x=>x[0])}}
const chat=[];
function renderAsk(){
  document.getElementById("ask").innerHTML=`<h1>Ask the data</h1><p class="sub">Type a question in your own words. Answers come only from a list of verified questions. If I can't answer, I'll say so.</p>
  <div class="chat" id="chatlog">${chat.length?chat.map(m=>m.html).join(""):`<div class="msg a">Hi! I can answer questions about revenue, profit, products, stores and stock. Try one of these:<div class="sugg">${QS.slice(0,5).map(q=>`<button class="chip" onclick="ask(this.textContent)">${q.title}</button>`).join("")}</div></div>`}</div>
  <div class="askrow"><input type="text" id="askin" placeholder="Ask a question about the toy store data…" onkeydown="if(event.key=='Enter')ask()"><button class="btn pri" onclick="ask()">Ask</button></div>`;
  const l=document.getElementById("chatlog");l.lastElementChild?.scrollIntoView({block:"nearest"});
}
function ask(text){
  const inp=document.getElementById("askin");const q=(text??inp.value).trim();if(!q)return;
  chat.push({html:`<div class="msg u">${q.replace(/</g,"&lt;")}</div>`});
  let html;
  if(AMBIG.test(q)){
    html=`<div class="msg a">“Best” can mean different things. Which do you mean?<div class="sugg"><button class="chip" onclick="ask('What were the five best-selling products?')">By units sold</button><button class="chip" onclick="ask('Which products generated the most profit last quarter?')">By profit (last quarter)</button><button class="chip" onclick="ask('Which product category had the best gross margin?')">By margin</button></div></div>`;
  } else if(UNSUP.test(q)){
    html=`<div class="msg a"><b>I can't answer that from this dataset.</b> It has sales, products, stores and a stock snapshot, but no customer, survey, review or forecast data. Closest things I can answer:<div class="sugg">${QS.slice(0,3).map(x=>`<button class="chip" onclick="ask(this.textContent)">${x.title}</button>`).join("")}</div></div>`;
  } else {
    const {best,score,near}=match(q);
    if(score<0.4){html=`<div class="msg a">I'm not confident I have a verified answer for that. Did you mean one of these?<div class="sugg">${near.map(x=>`<button class="chip" onclick="ask(this.textContent)">${x.title}</button>`).join("")}</div></div>`}
    else{const r=best.run(),max=Math.max(...r.rows.map(x=>x.v));
      html=`<div class="msg a"><div style="color:var(--ink2);font-size:12px;margin-bottom:6px">I understood this as: <b>${best.title}</b></div>${r.text}
      <div style="margin:10px 0">${hbars(r.rows,{w:600,fmt:r.fmt})}</div>
      <div class="meta"><span class="ok">✓ Pre-verified question</span> · Source: ${r.src}<br><b>How it's calculated:</b> ${r.def}<br>
      <button class="btn" style="margin-top:8px" onclick='csvDownload("answer.csv",[${JSON.stringify(r.cols)},...${JSON.stringify(r.rows.map(x=>[x.label,x.v]))}])'>⬇ Download CSV</button></div></div>`;}
  }
  chat.push({html});renderAsk();
}

/* ---------- router ---------- */
const TABS=[["dashboard","Dashboard"],["presentation","Presentation"],["toys","Toy Finder"],["ask","Ask"]];
let current="dashboard";
function show(t){current=t;location.hash=t;
  document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.id==t));
  document.getElementById("nav").innerHTML=TABS.map(([k,l])=>`<button class="${k==t?"on":""}" onclick="show('${k}')">${l}</button>`).join("");
  ({dashboard:renderDash,presentation:renderDeck,toys:renderToys,ask:renderAsk})[t]();
  closeToy();scrollTo(0,0)}
const h=location.hash.slice(1);
if(h.startsWith("toy:")){show("toys");openToy(+h.slice(4))}else{const hh=h.split("?")[0];show(TABS.some(t=>t[0]==hh)?hh:"dashboard")}
if(h=="ask-demo"){show("ask");ask("which products made the most profit last quarter");ask("how satisfied are our customers?");ask("which toy is the best?")}
if(h.startsWith("dash:")){dash.cats=new Set([h.slice(5)]);show("dashboard")}
if(h.startsWith("deck:")){slide=+h.slice(5);show("presentation")}
</script>
</body>
</html>
