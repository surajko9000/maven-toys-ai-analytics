<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maven Toys Analytics Hub</title>
<style>
@font-face{font-family:"Fredoka";src:url(fonts/Fredoka.ttf) format("truetype");font-weight:300 700;font-display:swap}
:root{
  --bg:#fff7e8; --surface:#ffffff; --line:#f0e3c8; --grid:#f3ead6;
  --ink:#1f1a17; --ink2:#5e564e; --ink3:#948a7f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s7:#6250d6;
  --good:#0e7a4f; --bad:#b4332f; --radius:20px;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:15px/1.5 var(--font);
  background:var(--bg) radial-gradient(#f3dfb4 1.2px,transparent 1.2px) 0 0/22px 22px}
header{background:#fff;position:sticky;top:0;z-index:10;border-bottom:4px solid transparent;
  border-image:linear-gradient(90deg,var(--s1),var(--s3),var(--s4),var(--s2),var(--s5),var(--s7)) 1}
.bar{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px;height:68px}
.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--s4),var(--s2));display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 #c9560f;transition:transform .2s}
.brand:hover .logo{transform:rotate(-12deg) scale(1.08)}
nav{display:flex;gap:2px;flex:1;overflow-x:auto;padding:6px 2px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{border:2px solid transparent;background:none;padding:8px 11px;border-radius:999px;font:inherit;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:transform .12s,background .12s}
nav button:hover{background:#fff1d6;transform:translateY(-1px)}
nav button.on{color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.badge{font-size:11.5px;font-weight:700;color:var(--ink2);background:#fff9e8;border-radius:999px;padding:5px 10px;white-space:nowrap}
@media(max-width:1180px){.badge{display:none}}
main{position:relative;z-index:1}
.cfbg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cfbg span{position:absolute;opacity:.55;animation:cff 8s ease-in-out infinite}
.cfbg .c-ci{border-radius:50%}.cfbg .c-sq{border-radius:4px;rotate:18deg}
.cfbg .c-st{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@media(max-width:700px){.cfbg span:nth-child(even){display:none}}
@media(prefers-reduced-motion:reduce){.cfbg span{animation:none}}

@media(prefers-reduced-motion:reduce){.side .stoy,.side .sstar{animation:none}}

/* ---- playful layer ---- */
h1,h2,h3,.brand,nav button,.btn,.chip,.hchips span,.tag,.hunlock,.eyebrow{font-family:var(--display)}
h1,h2.sec{letter-spacing:0;font-weight:600}
h3,.card h3,.hcard h3{font-weight:600}
header{background:#ffeec6}
nav button.on{box-shadow:0 4px 0 rgba(0,0,0,.18)}
.hherowrap{position:relative}

.cf{position:absolute;opacity:.7;pointer-events:none;animation:cff 7s ease-in-out infinite}
.c-ci{border-radius:50%}.c-sq{border-radius:4px;rotate:18deg}
.c-st{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes cff{0%,100%{translate:0 0}50%{translate:0 -9px}}
.shelf{display:flex;justify-content:center;align-items:flex-end;gap:6px;max-width:1010px;margin:0 auto;padding:0 6px}
.shelf button{flex:1;max-width:78px;aspect-ratio:1;background:none;border:0;cursor:pointer;padding:0;filter:drop-shadow(0 6px 3px rgba(60,40,10,.15));animation:bob 5s ease-in-out infinite;animation-delay:calc(var(--i)*-.45s);transition:scale .15s,rotate .15s}
.shelf button svg{width:100%;height:100%;display:block}
.shelf button:hover,.shelf button:focus-visible{animation-play-state:paused;scale:1.18;rotate:0deg;outline:none}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
.shelfboard{height:14px;max-width:1010px;margin:-7px auto 0;border-radius:10px;background:linear-gradient(#f3dcab,#e6c07a);box-shadow:0 5px 0 #d4ac66}
.ey{display:inline-block;width:20px;height:20px;vertical-align:-4px;margin:0 8px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ey.sm{width:10px;height:10px;vertical-align:1px;margin:0 2px}
.shelfhint{text-align:center;color:var(--ink3);font-size:13px;margin:10px 0 14px;font-weight:700}
.h1t{display:inline-block;width:50px;height:50px;vertical-align:-12px;margin-right:8px}.h1t svg{width:100%;height:100%;display:block}
.bot{display:inline-block;width:22px;height:22px;vertical-align:-6px;margin-right:2px}.bot svg{width:100%;height:100%;display:block}
@media(max-width:900px){.shelf button:nth-child(n+7){display:none}}
@media(prefers-reduced-motion:reduce){.cf,.shelf button{animation:none}}
.hcard:nth-child(1) .hb{background:#f4f8ff}.hcard:nth-child(2) .hb{background:#fffaf0}.hcard:nth-child(3) .hb{background:#f1fbf6}.hcard:nth-child(4) .hb{background:#fff3f8}
.hcard:hover{transform:translateY(-5px) rotate(-.7deg)}
.hcard:nth-child(even):hover{transform:translateY(-5px) rotate(.7deg)}
.hctx{background:#fffdf7}
.card.t:hover{transform:translateY(-3px) rotate(-.6deg)}

main{max-width:1200px;margin:0 auto;padding:24px 20px 70px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.02em;font-weight:800} .sub{color:var(--ink2);margin:0 0 18px;font-size:15px}
h2.sec{font-size:22px;font-weight:800;margin:34px 0 12px;display:flex;align-items:center;gap:10px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:0 5px 0 var(--line)}
.card h3{margin:0 0 2px;font-size:15px;font-weight:800} .card .note{color:var(--ink3);font-size:12px;margin-bottom:10px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.fgroup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 12px;margin-bottom:14px;box-shadow:0 4px 0 var(--line)}
.fbar{background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.fhead{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 14px;cursor:pointer;font:inherit;text-align:left;border-radius:16px;color:var(--ink)}
.fhead:hover{background:#fffaf0}
.fsum{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sc{background:#f4efe6;border-radius:999px;padding:3px 11px;font-weight:700;font-size:13px;color:var(--ink2)}
.sc.on{background:#e3eefb;color:#1c5cab}
.fch{font-weight:800;font-size:13px;color:var(--ink2);white-space:nowrap}
.freset{font-weight:800;font-size:12px;color:var(--bad);text-decoration:underline;white-space:nowrap}
.fbody{padding:2px 12px 12px;border-top:2px dashed var(--line)}
.fbody .fgroup{border:0;box-shadow:none;padding:6px 0;margin:6px 0 0}
.fdone{margin-top:8px}
.fgroup .lbl{font-weight:800;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;font:inherit;font-weight:700;color:var(--ink2);transition:transform .1s}
.chip:hover{border-color:#e2cf9f;transform:translateY(-1px)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
input[type=search],input[type=text],select{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font:inherit;min-width:170px;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--s1)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font:inherit;font-weight:700;color:var(--ink2);cursor:pointer}
.seg button.on{background:#e3eefb;color:#1c5cab}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{border-radius:20px;padding:14px 16px;border:2px solid rgba(0,0,0,.06);box-shadow:0 5px 0 rgba(0,0,0,.07)}
.kpi .e{font-size:22px}
.kpi .l{color:var(--ink2);font-size:12px;font-weight:700;margin-top:2px} .kpi .v{font-size:25px;font-weight:800;margin-top:0;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:2px}
.up{color:var(--good);font-weight:800}.down{color:var(--bad);font-weight:800}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
svg text{font:11px var(--font);fill:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--ink2);font-weight:800;padding:8px 6px;border-bottom:2px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:#fff}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--grid)}
.btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:var(--s1);color:#fff;border-color:var(--s1);box-shadow:0 3px 0 #1c5cab}
.defs{font-size:12px;color:var(--ink2);margin-top:16px;border-top:2px dashed var(--line);padding-top:10px}
#tip{position:fixed;pointer-events:none;background:#1f1a17;color:#fff;border-radius:10px;padding:6px 10px;font-size:12px;opacity:0;transition:opacity .08s;z-index:60;white-space:nowrap}
.tab{display:none}.tab.on{display:block;animation:tabin .3s ease-out}
@keyframes tabin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.leaving{opacity:0;transform:translateY(-8px);transition:opacity .2s ease,transform .2s ease}
.shelf button.pop{animation:popt .28s ease-out forwards !important;scale:1.35;z-index:3}
@keyframes popt{0%{translate:0 0}50%{translate:0 -22px}100%{translate:0 -10px;opacity:.9}}
.drawer.on .panel{animation:panelin .28s ease-out}
.drawer.on{animation:fadein .22s ease-out}
@keyframes panelin{from{transform:translateX(48px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.tab.on,.drawer.on,.drawer.on .panel{animation:none}main.leaving{transition:none}}
/* combo */
.combo{position:relative}
.combo input{min-width:220px;padding-right:30px}
.combo .list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:2px solid var(--line);border-radius:14px;max-height:190px;overflow:auto;z-index:20;display:none;box-shadow:0 10px 24px #0002}
.combo .list.on{display:block}
.combo .opt{padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;height:38px}
.combo .opt:hover,.combo .opt.hl{background:#fff1d6}
.combo .opt small{color:var(--ink3);margin-left:auto;font-size:11px}
.combo .x{position:absolute;right:8px;top:7px;cursor:pointer;color:var(--ink3);font-weight:800}
/* start page */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:44px 40px;color:#fff;background:linear-gradient(135deg,#2a78d6,#6250d6 55%,#e87ba4);box-shadow:0 8px 0 #4a3aa7}
.hero h1{font-size:42px;line-height:1.08;max-width:760px;margin-bottom:12px}
.hero p{font-size:18px;max-width:700px;margin:0 0 18px;color:#f1ecff}
.hero .pill{display:inline-block;background:#ffffff26;border-radius:999px;padding:6px 14px;font-weight:700;margin:0 6px 6px 0;font-size:14px}
.conf{position:absolute;border-radius:6px;opacity:.9}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card ul{margin:6px 0 0;padding-left:20px}.card li{margin:5px 0}
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;justify-content:center}
.node{border-radius:18px;padding:14px 16px;text-align:center;font-weight:800;border:2px solid rgba(0,0,0,.08);min-width:150px}
.node small{display:block;font-weight:600;color:var(--ink2);margin-top:2px}
.arrow{display:grid;place-items:center;font-size:28px;color:var(--ink3)}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tour{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tour .t{cursor:pointer;transition:transform .12s;text-align:left}
.tour .t:hover{transform:translateY(-4px) rotate(-.6deg)}
.tour .e{font-size:34px}.tour h3{font-size:17px;margin:6px 0 4px}.tour p{margin:0;color:var(--ink2);font-size:13.5px}
.tour .job{margin-top:10px;font-size:12px;font-weight:800;color:var(--ink2);background:#fff7e8;border-radius:999px;display:inline-block;padding:3px 10px}
.tour .go{display:block;margin-top:10px;font-weight:800;color:var(--s1)}
.quick{display:flex;flex-wrap:wrap;gap:10px}
/* presentation */
.deck{background:linear-gradient(150deg,#1d2b64,#3b2f8f 60%,#7a3fa0);color:#fff;border-radius:28px;min-height:470px;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 8px 0 #1a1550}
.deck h2{font-size:34px;line-height:1.15;margin:0 0 14px;letter-spacing:-.02em;max-width:780px;font-weight:800}
.deck p{color:#dcd7ff;max-width:720px;font-size:16px}
.deck .big{font-size:76px;font-weight:800;letter-spacing:-.04em}
.deck svg text{fill:#dcd7ff!important}
.deck .ctl{display:flex;justify-content:space-between;align-items:center;color:#c1bbf5;font-size:13px;position:relative;z-index:1}
.deck .ctl button{background:#ffffff22;color:#fff;border:0;border-radius:14px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:700}
.deck .ctl button:hover{background:#ffffff40}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#ffffff40;display:block}.dots i.on{background:#ffd34d}
.src{font-size:12px;color:var(--ink2);margin-top:12px}
.pair{display:flex;gap:30px;flex-wrap:wrap;margin:6px 0 10px}.pair div{font-size:14px;color:#dcd7ff}.pair b{display:block;font-size:44px;color:#fff;letter-spacing:-.03em}
/* toys */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.toy{background:#fff;border:2px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;transition:transform .12s;box-shadow:0 5px 0 var(--line);position:relative}
.toy:hover{transform:translateY(-4px) rotate(-.8deg)}
.toy .img{height:128px;display:grid;place-items:center;font-size:58px;position:relative;border-bottom:2px solid var(--line)}
.toy .img img,.hero-img img{width:100%;height:100%;object-fit:cover}
.toy .b{padding:10px 13px 13px}
.toy .n{font-weight:800}.toy .c{font-size:12px;color:var(--ink2)}
.toy .m{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink2)}
.toy .m b{color:var(--ink)}
.art{display:block;width:116px;height:116px}.hero-img .art{width:164px;height:164px}
.rank{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;border-radius:999px;font-weight:800;font-size:13px;padding:3px 10px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.rank.r1{background:#f2b400;color:#3a2a00}.rank.r2{background:#c9ced6;color:#222}.rank.r3{background:#d98a4e;color:#2d1600}
.toy .img{border-bottom:2px solid var(--line)}
.toy .c i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--cc)}
.toy .n{font-size:15px}
.toy .m{gap:8px}.toy .m span{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;color:var(--ink2);line-height:1.25}
.toy .m b{display:block;font-size:15px}
.toy.off{opacity:.55}
.toy .na{margin-top:8px;font-size:12px;color:var(--ink3);background:#f4efe6;border-radius:10px;padding:6px 8px;text-align:center}
.oos{position:absolute;top:8px;right:8px;background:#fff0ee;color:var(--bad);border-radius:999px;font-weight:800;font-size:11px;padding:2px 8px}
.drawer{position:fixed;inset:0;background:#1f1a1766;display:none;z-index:40;justify-content:flex-end}
.drawer.on{display:flex}
.panel{width:min(580px,100%);background:#fffdf8;height:100%;overflow:auto;padding:22px;border-left:4px solid var(--line)}
.panel .hero-img{height:170px;border-radius:20px;display:grid;place-items:center;font-size:86px;margin-bottom:14px;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{border:2px solid var(--line);border-radius:16px;padding:10px;background:#fff}
.stat .l{font-size:11px;color:var(--ink2);font-weight:700}.stat .v{font-size:19px;font-weight:800}
.tag{font-size:11px;font-weight:700;color:var(--ink2);background:#fff1d6;border-radius:8px;padding:2px 8px}
.credit{font-size:11px;color:var(--ink3);margin-top:-6px;margin-bottom:10px}
.sortbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.dir{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:14px;padding:7px 13px;font:inherit;font-weight:800;cursor:pointer}
.cap{color:var(--ink2);margin:0 0 12px;font-size:14px}
/* ask */
.askwrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;gap:12px;height:1000px;max-height:none;min-height:360px;overflow-y:auto;padding:14px;background:#fffdf8;border:2px solid var(--line);border-radius:18px;scroll-behavior:smooth;overscroll-behavior:contain}
.msg{max-width:740px;border-radius:20px;padding:12px 15px}
.msg.u{align-self:flex-end;background:var(--s1);color:#fff;border-bottom-right-radius:6px;font-weight:600}
.msg.a{align-self:flex-start;background:#fff;border:2px solid var(--line);width:min(740px,100%);border-bottom-left-radius:6px;box-shadow:0 4px 0 var(--line)}
.msg .who{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:4px}
.msg .meta{font-size:12px;color:var(--ink2);margin-top:10px;border-top:2px dashed var(--line);padding-top:8px}
.msg .meta b{color:var(--ink)}
.ok{color:var(--good);font-weight:800}
.askrow{display:flex;gap:8px;margin-top:14px}.askrow input{flex:1;padding:11px 14px;font-size:15px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.msg.a .sugg .chip{font-size:12.5px;padding:3px 10px;border-width:1.5px}
.msg.a .meta .btn{padding:4px 10px;font-size:12.5px;box-shadow:0 2px 0 var(--line)}
.slot{display:inline-block;background:#e3eefb;color:#1c5cab;border-radius:999px;font-size:12px;font-weight:800;padding:2px 10px;margin:0 4px 4px 0}
.typing span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-right:4px;animation:b 1s infinite}
.shero{background:#fff;border:2px solid var(--line);border-left:8px solid var(--s7);border-radius:var(--radius);padding:24px 28px;margin-bottom:18px;box-shadow:0 5px 0 var(--line)}
.shero h1{margin:12px 0 10px;font-size:34px;line-height:1.15}.shero p{font-size:16.5px;line-height:1.55;margin:8px 0;max-width:820px;color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;margin-top:22px;font-size:15.5px;line-height:1.5;background:#fff}.cta:hover{transform:translateY(-1px)}
.lnk{color:#1c5cab;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap;margin-left:6px}.lnk:hover{text-decoration:underline}
.mut{color:var(--ink2)}
.h3b{margin:0 0 6px !important;font-size:17px !important}
.two ul.plain li{font-size:15px}
.whom{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px}.whom p{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}

for(const [sid,pid,q] of DATA.INVS){const r=INV[pid];r.stock+=q;r.stocked++;if(q==0){r.zero++;r.zeroStores.push(sid)}}
const fmt$ = v => Math.abs(v)>=1e6?`$${(v/1e6).toFixed(2)}M`:Math.abs(v)>=1e3?`$${(v/1e3).toFixed(0)}K`:`$${v.toFixed(0)}`;

/* ---------- shared "metrics" layer: one set of definitions for every tab ---------- */
function agg({cats=null,pid=null,m0=0,m1=20}={}){
  const byMonth=Array.from({length:21},()=>({rev:0,gp:0,units:0}));
  const byProd={}, byStore={}, byCat={}, tot={rev:0,gp:0,units:0};
  for(const [sid,p,mi,u] of DATA.SMP){
    if(mi<m0||mi>m1) continue; if(pid&&p!=pid) continue; if(cats&&!cats.includes(P[p].cat)) continue;
    const r=rev(p,u),g=gp(p,u);
    const M=byMonth[mi];M.rev+=r;M.gp+=g;M.units+=u;
    const b=byProd[p]??={rev:0,gp:0,units:0};b.rev+=r;b.gp+=g;b.units+=u;
    const s=byStore[sid]??={rev:0,gp:0,units:0};s.rev+=r;s.gp+=g;s.units+=u;
    const c=byCat[P[p].cat]??={rev:0,gp:0,units:0};c.rev+=r;c.gp+=g;c.units+=u;
    tot.rev+=r;tot.gp+=g;tot.units+=u;}
  return {tot,byMonth,byProd,byStore,byCat};
}

function hbars(rows,{w=520,color="var(--s1)",fmt=fmt$,label=r=>r.label,rowH=26,vw=70}={}){
  if(!rows.length) return `<div class="note">No data for this selection.</div>`;
  const max=Math.max(...rows.map(r=>r.v),1e-9),lw=150,h=rows.length*rowH+6;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">`+rows.map((r,i)=>{
    const y=i*rowH+3,bw=Math.max(2,(w-lw-vw)*Math.max(r.v,0)/max),L=label(r);
    return `<g data-tip="${esc(r.tip??L+": "+fmt(r.v))}"><text x="${lw-8}" y="${y+14}" text-anchor="end">${esc(L.length>24?L.slice(0,23)+"…":L)}</text>
    <rect x="${lw}" y="${y+3}" width="${bw}" height="${rowH-10}" rx="5" fill="${r.color??color}"/>
    <text x="${lw+bw+6}" y="${y+14}" style="fill:var(--ink)">${r.vtext??fmt(r.v)}</text></g>`}).join("")+`</svg>`;
}
function line(vals,{w=640,h=240,color="var(--s1)",fmt=fmt$,labels=mlabel}={}){
  const L=46,R=12,T=10,B=26,hi=(Math.max(...vals,0)*1.1)||1e-9,lo=Math.min(...vals,0)*1.1,n=Math.max(vals.length-1,1),x=i=>L+(w-L-R)*i/n,y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[0,.25,.5,.75,1].map(t=>lo+t*(hi-lo));
  const path=vals.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area=path+`L${x(vals.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const step=Math.ceil(vals.length/7);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">`+
   ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("")+
   `<line x1="${L}" x2="${w-R}" y1="${y(0)}" y2="${y(0)}" stroke="#d9cfb2" stroke-width="1.5"/><path d="${area}" fill="${color}" opacity=".10"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`+
   vals.map((v,i)=>`<g data-tip="<b>${labels(i)}</b><br>${fmt(v)}"><rect x="${x(i)-((w-L-R)/n)/2}" y="${T}" width="${(w-L-R)/n}" height="${h-T-B}" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${color}" stroke="#fff" stroke-width="2"/></g>`).join("")+

}

function parseSlots(q){
  const t=" "+q.toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ")+" ";const slots={chips:[]};
  // toy
  for(const [a,id] of ALIAS){const re=new RegExp(`\\b${a}s?\\b`);if(re.test(t)){slots.pid=id;slots.chips.push("Toy: "+P[id].name);break}}
  // category
  const cm=[[/\b(games?)\b/,"Games"],[/\b(art|crafts?|arts)\b/,"Art & Crafts"],[/\b(sports?|outdoors?)\b/,"Sports & Outdoors"],[/\b(electronics?|gadgets?)\b/,"Electronics"],[/\b(in|for|within|of) (the )?toys\b|\btoys category\b|\btoy category\b/,"Toys"]];
  for(const [re,c] of cm) if(re.test(t)&&!(slots.pid&&P[slots.pid].cat!==c&&c!="Toys")){slots.cats=[c];slots.chips.push("Category: "+c);break}
  // period
  let m;
  if(/\blast quarter\b|\blatest quarter\b/.test(t)){slots.m0=18;slots.m1=20;slots.period="Q3 2023 (last full quarter in the data)"}
  else if(m=t.match(/\bq([1-4])\s*(?:20)?(22|23)?\b/)){const qn=+m[1];let yr=m[2]?+("20"+m[2]):(qn<=3?2023:2022);const s=(yr-2022)*12+(qn-1)*3;if(s+2<=20&&s>=0){slots.m0=s;slots.m1=s+2;slots.period=`Q${qn} ${yr}`+(m[2]?"":" (assumed)")}}
  else if(/\blast (3|three) months\b/.test(t)){slots.m0=18;slots.m1=20;slots.period="last 3 months of data (Jul–Sep 2023)"}
  else if(/\blast month\b/.test(t)){slots.m0=20;slots.m1=20;slots.period="Sep 2023 (last month in the data)"}
  else if((m=t.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?|(?:in|during|for) may)\s*(?:20)?(22|23)?\b/))){const w=m[1].replace(/^(in|during|for) /,"").slice(0,3);const mi=MN.map(x=>x.toLowerCase()).indexOf(w);let yr=m[2]?+("20"+m[2]):(mi<=8?2023:2022);const idx=(yr-2022)*12+mi;if(mi>=0&&idx>=0&&idx<=20){slots.m0=idx;slots.m1=idx;slots.period=mlong(idx)+(m[2]?"":" (assumed)")}}
  else if(m=t.match(/\b(2022|2023)\b/)){const y=+m[1];slots.m0=y==2022?0:12;slots.m1=y==2022?11:20;slots.period=y==2022?"2022":"2023 (Jan–Sep, the data ends in Sep)"}
  if(slots.period) slots.chips.push("Period: "+slots.period);
  return slots;
}

  <div class="card side"><h3>📚 Browse approved questions</h3>${Object.entries(groups).map(([g,qs])=>`<div class="grp"><div class="gt">${g}</div>${qs.map(q=>`<button onclick="ask(this.textContent,true)">${q.title}</button>`).join("")}</div>`).join("")}<div class="note">Tip: add a toy, category or time period to any question.</div></div></div>`;
  const l=document.getElementById("chatlog");if(chat.length)l.scrollTop=l.scrollHeight;
}
function ask(text,instant){
  if(askBusy&&!instant)return;
  const inp=document.getElementById("askin");const q=(text??inp?.value??"").trim();if(!q)return;
  chat.push({html:`<div class="msg u">${esc(q)}</div>`});while(chat.length>60)chat.shift();
  const done=()=>{chat.pop();chat.push({html:answer(q)});askBusy=false;renderAsk()};
  if(instant){chat.push({html:""});done();return}
  askBusy=true;const steps=["Reading your question…","Matching it to an approved calculation…","Computing from the CSVs…"];
  const tp=s=>`<div class="msg a typing"><span></span><span></span><span></span><i class="stp">${s}</i></div>`;
  chat.push({html:tp(steps[0])});renderAsk();
  steps.slice(1).forEach((s,k)=>setTimeout(()=>{if(askBusy){chat[chat.length-1].html=tp(s);renderAsk()}},(k+1)*380));
  setTimeout(done,steps.length*380);
}
const chips=(arr)=>`<div class="sugg">${arr.map(t=>`<button class="chip" onclick="ask(this.textContent)">${esc(t)}</button>`).join("")}</div>`;
function answer(q){
  const slots=parseSlots(q);
  const FOLLOW=/^\s*(and|what about|how about|same|now|ok|okay|then|what if|also|instead|just)\b/i;
  const metric=METRICW.test(q);
  if(UNSUP.test(q)) return `<div class="msg a"><div class="who"><span class="bot">${ILLUS[34]}</span>Toy-Box Analyst</div><b>I can't answer that from this dataset.</b> It has sales, toys, stores and a stock snapshot, but no customer, survey, review, promotion or forecast data. Closest things I can answer:${chips(["Which toys generated the most profit?","How has revenue changed over time?","How does 2023 compare with 2022?"])}</div>`;
  if(/\bwhy\b/i.test(q)) return `<div class="msg a"><div class="who"><span class="bot">${ILLUS[34]}</span>Toy-Box Analyst</div><b>I can show you <i>what</i> changed, but not <i>why</i>.</b> The data has no information about causes like promotions or supply problems. I can show where the change happened:${chips(["How has revenue changed over time?","How does 2023 compare with 2022?","Which category has the best gross margin?"])}</div>`;
  if(AMBIG.test(q)&&!metric&&/\b(toy|toys|product|products)\b/i.test(q)) return `<div class="msg a"><div class="who"><span class="bot">${ILLUS[34]}</span>Toy-Box Analyst</div>“Best” can mean different things. Which do you mean?${chips(["What were the best-selling toys?","Which toys generated the most profit?","Which toys brought in the most revenue?"])}</div>`;
  let {best,score,near}=match2(q);
  const isFollow=!!lastAsk&&slots.chips.length>0&&(!best||score<MATCH_MIN||FOLLOW.test(q));
  if(isFollow){best=lastAsk.q;near=[best,...best.rel.map(id=>QI[id])]}
  const ctx=isFollow?{m0:0,m1:20,...lastAsk.slots,...slots}:{m0:0,m1:20,...slots};
  if(isFollow){const key=c=>c.split(":")[0];const mine=new Set(slots.chips.map(key));slots.chips=[...slots.chips,...lastAsk.chips.filter(c=>!mine.has(key(c)))]}
  if(!isFollow&&(!best||score<MATCH_MIN)) return `<div class="msg a"><div class="who"><span class="bot">${ILLUS[34]}</span>Toy-Box Analyst</div>I'm not sure I have an approved answer for that. Did you mean one of these?${chips(near.map(x=>x.title))}</div>`;
  if(best.needs=="pid"&&!ctx.pid) return `<div class="msg a"><div class="who"><span class="bot">${ILLUS[34]}</span>Toy-Box Analyst</div>Which toy do you mean?${chips(["Lego Bricks","Colorbuds","Rubik's Cube","Nerf Gun","Monopoly","Jenga"].map(n=>`Which stores sell the most ${n}?`))}</div>`;
  const r=best.run(ctx);
  if(r)lastAsk={q:best,slots:{...ctx},chips:[...slots.chips]};
  if(!r) return `<div class="msg a"><div class="who"><span class="bot">${ILLUS[34]}</span>Toy-Box Analyst</div>I understood this as <b>${best.title}</b>, but there are no sales for that combination${slots.chips.length?` (${slots.chips.join(", ")})`:""}. Try a wider time period.${chips(near.map(x=>x.title))}</div>`;
  let chart="";
  if(r.chart=="line") chart=line(r.series,{w:600,h:200,fmt:r.fmt,labels:i=>mlabel(i+r.offset)});
  else if(r.chart=="cards") chart=`<div class="bignum">${r.cards.map(c=>`<div><span style="font-size:12px;color:var(--ink2);font-weight:700">${c.l}</span><b class="${c.v>=0?"up":"down"}">${c.v>=0?"▲":"▼"} ${Math.abs(c.v).toFixed(1)}%</b></div>`).join("")}</div>`;
  else chart=hbars(r.rows,{w:600,fmt:r.fmt});
  const follow=[...best.rel.map(id=>QI[id].title)];
  const extra=[];if(!ctx.period&&best.needs!="pid"&&best.id!="yoy"&&best.id!="low_stock"&&best.id!="zero_stock")extra.push(best.title.replace(/\?$/,"")+" last quarter?");if(!ctx.cats&&best.needs!="pid"&&!["low_stock","zero_stock"].includes(best.id))extra.push(best.title.replace(/\?$/,"")+" in Games?");
  return `<div class="msg a"><div class="who"><span class="bot">${ILLUS[34]}</span>Toy-Box Analyst</div>
    <div style="font-size:12px;color:var(--ink2);margin-bottom:6px">${isFollow?"Following up on your last question. ":""}I understood this as: <b>${best.title}</b>${slots.chips.length?`<br>${slots.chips.map(c=>`<span class="slot">${esc(c)}</span>`).join("")}`:""}</div>${esc(r.text)}
    <div style="margin:6px 0">${chart}</div>
    <div class="meta"><span class="ok">✓ Approved question</span> · computed live from the CSVs · Source: ${r.src}<br><b>How it's calculated:</b> ${r.def}
    <button class="btn" style="margin-left:8px" onclick='csvDownload("answer.csv",[${JSON.stringify(r.cols)},...${JSON.stringify(r.rows.map(x=>[x.label,x.v]))}])'>⬇ Download CSV</button></div>
    ${chips([...follow,...extra].slice(0,4))}</div>`;
}



/* ---------- soft confetti behind every page ---------- */
(function(){
  const C=["#ffd34d","#ff8fb1","#7be0b3","#9fc2ff","#ff9a5a","#b78cff"],K=["c-ci","c-sq","c-st"];
  let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
  const bg=document.createElement("div");bg.className="cfbg";bg.setAttribute("aria-hidden","true");
  const COLS=8,ROWS=6;let i=0;
  for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++,i++){const sz=11+Math.round(r()*10);
    const left=(col+.15+r()*.7)/COLS*96,top=14+(row+.15+r()*.7)/ROWS*82;
    bg.insertAdjacentHTML("beforeend",`<span class="${K[(i+row)%3]}" style="left:${left.toFixed(1)}%;top:${top.toFixed(1)}%;width:${sz}px;height:${sz}px;background:${C[(i*5+row)%6]};animation-delay:${(-r()*8).toFixed(1)}s"></span>`)}
  document.body.appendChild(bg);
})();

/* ---------- router ---------- */
const TABS=[["start","🏠","Home","var(--s7)"],["dashboard","📊","Dashboard","var(--s1)"],["toys","🧸","Toy Finder","var(--s5)"],["presentation","🎤","Presentation","#d68700"],["ask","💬","Ask","var(--s3)"]];
let current="start";
function show(t){current=t;history.replaceState(null,"","#"+t);
  document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.id==t));
  document.getElementById("nav").innerHTML=TABS.map(([k,e,l,c])=>`<button class="${k==t?"on":""}" style="${k==t?`background:${c}`:""}" onclick="show('${k}')">${e} ${l}</button>`).join("");
  ({start:renderStart,dashboard:renderDash,presentation:renderDeck,toys:renderToys,ask:renderAsk})[t]();
  closeToy();scrollTo(0,0)}
(function(){const h=location.hash.slice(1);
  if(h=="dash-open"){dash.fopen=true;show("dashboard");return}
  if(h=="dash-filt"){setPreset("l3");dash.cats=new Set(["Games"]);show("dashboard");return}
  if(h=="toys-open"){toys.fopen=true;show("toys");return}
  if(h=="toys-l3"){toyPreset("l3");show("toys");return}
  if(h.startsWith("toy:")){show("toys");openToy(+h.slice(4))}
  else if(h.startsWith("dash:")){dash.cats=new Set([h.slice(5)]);show("dashboard")}
  else if(h.startsWith("pid:")){dash.pid=+h.slice(4);show("dashboard")}
  else if(h=="dash-mg"){dash.metric="mg";dash.trend="pct";show("dashboard")}
  else if(h=="dash-pct"){dash.trend="pct";dash.show="pct";show("dashboard")}
  else if(h.startsWith("deck:")){slide=+h.slice(5);show("presentation")}
  else if(h=="ask-demo"){show("ask");["which toys made the most profit last quarter","best selling toys in games in 2022","which stores sell the most lego","how satisfied are our customers?","which toy is the best?","wich category has the best margn"].forEach(q=>ask(q,true))}
  else if(h=="ask-home"){show("ask");ask("which toys made the most profit",true)}
  else if(h=="ask-help"){askHelpOpen=true;show("ask")}
  else if(h=="ask-ex"){show("ask")}
  else if(h=="ask-eval"){show("ask");const o=runEval();document.getElementById("ask").insertAdjacentHTML("afterbegin",`<pre id="evalout">${JSON.stringify(o)}</pre>`)}
  else if(h=="ask-follow"){show("ask");["which toys made the most profit","what about electronics?","and in 2022?","best selling toys","which stores sell the most lego"].forEach(q=>ask(q,true))}
  else show(TABS.some(t=>t[0]==h)?h:"start")})();
</script>
