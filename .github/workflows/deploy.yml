# Publishes the prebuilt static site (site/) to GitHub Pages on every push to main.
# site/index.html is generated: run `python3 scripts/build_site.py` and commit the result.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
